# MeanFlow 4-step distillation config tuned for Colab G4 RTX PRO 6000 (96 GB).
# Distills from SC29 v2_full s8000 RF teacher while keeping condition encoders frozen.

model:
  flow_parameterization: meanflow
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 102400
  text_tokenizer_repo: sbintuitions/modernbert-ja-310m
  text_encoder_revision: 77675fc96a7e445e982e2ba90246b816efc74ec6
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 512
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 192
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 102400
  caption_tokenizer_repo: sbintuitions/modernbert-ja-310m
  caption_add_bos: true
  caption_dim: 512
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: meanflow_distill
  teacher_checkpoint: /content/sc29_work/teacher/model_s8000.safetensors
  teacher_steps: 40
  meanflow_anchor_prob: 0.5
  meanflow_time_logit_mean: 0.4
  meanflow_time_logit_std: 1.0
  meanflow_adaptive_weight_power: 0.5
  meanflow_adaptive_weight_eps: 0.001
  meanflow_cfg_text_scale: 3.0
  meanflow_cfg_caption_scale: 4.0
  meanflow_cfg_speaker_scale: 5.0
  meanflow_cfg_min_t: 0.5
  meanflow_cfg_max_t: 1.0
  meanflow_teacher_chunk_size: 32
  meanflow_teacher_branch_batch_size: 3
  meanflow_teacher_fuse_base_branch: true
  meanflow_compile_teacher: false
  meanflow_teacher_device_offset: 0
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 8
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: true
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false
  gradient_checkpointing: false
  precision: bf16
  optimizer: muon
  muon_momentum: 0.95
  learning_rate: 0.0001
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 200
  pretrained_projector_warmup_steps: 0
  stable_steps: 7800
  min_lr_scale: 0.01
  max_steps: 10000
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.0
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true
  max_latent_steps: 500
  ref_min_seconds: 1.0
  ref_max_seconds: 30.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  log_every: 20
  save_every: 500
  checkpoint_best_n: 2
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
  valid_ratio: 0.002
  valid_every: 1000
  seed: 42
